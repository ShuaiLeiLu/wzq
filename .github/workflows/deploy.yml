name: Deploy Gomoku

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wzq-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check and build the Rust server
        run: |
          node --check public/app.js
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --check
          cargo +stable test --locked
          cargo +stable build --locked --release

      - name: Deploy the checked revision
        env:
          DEPLOY_KEY: ${{ secrets.WZQ_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.WZQ_DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ vars.WZQ_DEPLOY_KNOWN_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_HOST_KEY"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          install -Dm755 target/release/wzq-server "$ssh_dir/release/bin/wzq-server"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$ssh_dir/known_hosts"
          tar -czf - -C "$ssh_dir/release" bin |
            ssh -T -i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              "wzq-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA"
