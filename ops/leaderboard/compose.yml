services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wzq
      POSTGRES_USER: wzq_owner
      POSTGRES_PASSWORD: ${WZQ_DB_OWNER_PASSWORD:?configure the database owner password}
      WZQ_DB_AUTH_PASSWORD: ${WZQ_DB_AUTH_PASSWORD:?configure the PostgREST database password}
    volumes:
      - database:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/010-leaderboard.sh:ro
      - ./champion.sql:/docker-entrypoint-initdb.d/020-champion.sql:ro
      - ./schema.sql:/opt/wzq/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wzq_owner -d wzq"]
      interval: 3s
      timeout: 3s
      retries: 15

  postgrest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgresql://wzq_authenticator:${WZQ_DB_AUTH_PASSWORD}@db:5432/wzq
      PGRST_DB_SCHEMAS: wzq_api
      PGRST_JWT_SECRET: ${WZQ_POSTGREST_JWT_SECRET:?configure the PostgREST signing secret}
    ports:
      - "127.0.0.1:${WZQ_POSTGREST_PORT:-3042}:3000"

volumes:
  database:
